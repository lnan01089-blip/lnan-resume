<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Night read 夜读">
  <rect width="600" height="800" fill="#FAFAFA"/>
  <!-- 月亮 -->
  <circle cx="450" cy="160" r="60" fill="#D4D4D8" opacity="0.9"/>
  <circle cx="430" cy="150" r="60" fill="#FAFAFA"/>
  <!-- 星星 -->
  <g fill="#EFEFF1">
    <circle cx="150" cy="140" r="4"/><circle cx="220" cy="90" r="3"/><circle cx="320" cy="200" r="3"/><circle cx="120" cy="240" r="3"/>
  </g>
  <!-- 书 -->
  <g transform="translate(300 480)">
    <path d="M-150 0 L0 -30 L0 150 L-150 180 Z" fill="#3F3F46"/>
    <path d="M150 0 L0 -30 L0 150 L150 180 Z" fill="#3F3F46"/>
    <line x1="0" y1="-30" x2="0" y2="150" stroke="#18181B" stroke-width="6"/>
    <g stroke="#A1A1AA" stroke-width="4" opacity="0.8">
      <line x1="-120" y1="20" x2="-30" y2="6"/><line x1="-120" y1="50" x2="-30" y2="36"/>
      <line x1="30" y1="6" x2="120" y2="20"/><line x1="30" y1="36" x2="120" y2="50"/>
    </g>
  </g>
  <circle cx="300" cy="300" r="6" fill="#D4D4D8"/>
</svg>
