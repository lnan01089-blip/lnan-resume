<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="既有建筑绿色改造研究项目封面">
  <rect width="480" height="300" fill="#FAFAFA"/>
  <circle cx="120" cy="220" r="130" fill="#D4D4D8" opacity="0.14"/>
  <!-- 建筑轮廓 -->
  <g stroke="#18181B" stroke-width="3" fill="none" opacity="0.85">
    <rect x="160" y="80" width="120" height="150" rx="4"/>
    <line x1="160" y1="120" x2="280" y2="120"/>
    <line x1="160" y1="160" x2="280" y2="160"/>
    <line x1="200" y1="80" x2="200" y2="230"/>
    <line x1="240" y1="80" x2="240" y2="230"/>
    <path d="M160 80 L220 44 L280 80"/>
  </g>
  <!-- 窗户绿意 -->
  <rect x="170" y="92" width="22" height="22" rx="2" fill="#D4D4D8" opacity="0.85"/>
  <rect x="248" y="92" width="22" height="22" rx="2" fill="#D4D4D8" opacity="0.85"/>
  <rect x="170" y="172" width="22" height="22" rx="2" fill="#D4D4D8" opacity="0.6"/>
  <!-- 叶片（绿色改造） -->
  <g transform="translate(300 150)">
    <path d="M0 0 Q40 -30 70 -8 Q34 6 0 0 Z" fill="#D4D4D8"/>
    <path d="M0 0 Q-30 30 -8 60 Q6 26 0 0 Z" fill="#A1A1AA"/>
  </g>
  <!-- 数据节点 -->
  <circle cx="120" cy="90" r="6" fill="#EFEFF1"/>
  <circle cx="360" cy="110" r="6" fill="#EFEFF1"/>
  <circle cx="380" cy="200" r="6" fill="#EFEFF1"/>
  <line x1="120" y1="90" x2="200" y2="100" stroke="#A1A1AA" stroke-width="1.5" opacity="0.6"/>
  <line x1="360" y1="110" x2="280" y2="160" stroke="#A1A1AA" stroke-width="1.5" opacity="0.6"/>
</svg>
