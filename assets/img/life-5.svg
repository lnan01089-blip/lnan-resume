<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Exhibition 看展">
  <rect width="600" height="800" fill="#FAFAFA"/>
  <!-- 墙 -->
  <rect x="0" y="0" width="600" height="620" fill="#F4F4F5"/>
  <!-- 画框 -->
  <g>
    <rect x="90" y="150" width="150" height="180" rx="4" fill="#18181B" stroke="#D4D4D8" stroke-width="6"/>
    <rect x="110" y="172" width="110" height="136" fill="#3F3F46"/>
    <circle cx="150" cy="210" r="20" fill="#EFEFF1" opacity="0.85"/>
    <path d="M110 300 L150 250 L190 290 L230 240 L220 308 Z" fill="#D4D4D8" opacity="0.75"/>
  </g>
  <g>
    <rect x="360" y="190" width="150" height="150" rx="4" fill="#18181B" stroke="#EFEFF1" stroke-width="6"/>
    <rect x="380" y="210" width="110" height="110" fill="#3F3F46"/>
    <line x1="380" y1="265" x2="490" y2="265" stroke="#D4D4D8" stroke-width="4"/>
    <line x1="435" y1="210" x2="435" y2="320" stroke="#D4D4D8" stroke-width="4"/>
  </g>
  <!-- 看展小人 -->
  <g fill="#18181B" transform="translate(270 470)">
    <circle cx="0" cy="0" r="20"/>
    <rect x="-14" y="22" width="28" height="64" rx="12"/>
    <rect x="-12" y="86" width="10" height="50" rx="5" transform="rotate(8 -12 86)"/>
    <rect x="2" y="86" width="10" height="50" rx="5" transform="rotate(-8 2 86)"/>
