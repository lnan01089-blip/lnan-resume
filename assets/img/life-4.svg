<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="On the road 出行">
  <rect width="600" height="800" fill="#FAFAFA"/>
  <!-- 太阳 -->
  <circle cx="470" cy="180" r="70" fill="#EFEFF1" opacity="0.9"/>
  <!-- 远山 -->
  <path d="M0 420 L140 280 L260 420 Z" fill="#3F3F46"/>
  <path d="M200 420 L360 250 L520 420 Z" fill="#3F3F46"/>
  <path d="M380 420 L500 320 L600 420 Z" fill="#3F3F46"/>
  <!-- 路面 -->
  <rect x="0" y="560" width="600" height="240" fill="#18181B"/>
  <rect x="0" y="560" width="600" height="10" fill="#A1A1AA" opacity="0.5"/>
  <!-- 中线虚线 -->
  <g fill="#D4D4D8">
    <rect x="120" y="660" width="60" height="10" rx="5"/>
    <rect x="280" y="700" width="70" height="12" rx="6"/>
    <rect x="440" y="740" width="80" height="14" rx="7"/>
  </g>
  <!-- 小车 -->
  <g transform="translate(230 600)">
    <rect x="0" y="20" width="150" height="46" rx="14" fill="#18181B"/>
    <path d="M20 20 q20 -34 60 -34 h30 q26 0 40 34 Z" fill="#18181B"/>
    <rect x="40" y="0" width="80" height="22" rx="8" fill="#3F3F46"/>
    <circle cx="40" cy="74" r="16" fill="#18181B"/><circle cx="40" cy="74" r="7" fill="#A1A1AA"/>
    <circle cx="120" cy="74" r="16" fill="#18181B"/><circle cx="120" cy="74" r="7" fill="#A1A1AA"/>
  </g>
</svg>
