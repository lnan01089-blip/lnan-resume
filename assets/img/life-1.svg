<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="City walk 城市散步">
  <rect width="600" height="800" fill="#FAFAFA"/>
  <circle cx="470" cy="150" r="90" fill="#D4D4D8" opacity="0.16"/>
  <!-- 天际线 -->
  <g fill="#3F3F46">
    <rect x="60" y="360" width="90" height="320"/>
    <rect x="170" y="300" width="110" height="380"/>
    <rect x="300" y="380" width="80" height="300"/>
    <rect x="400" y="330" width="120" height="350"/>
  </g>
  <g fill="#FAFAFA">
    <rect x="80" y="390" width="18" height="24"/><rect x="110" y="390" width="18" height="24"/>
    <rect x="190" y="330" width="20" height="26"/><rect x="225" y="330" width="20" height="26"/><rect x="190" y="380" width="20" height="26"/>
    <rect x="420" y="370" width="20" height="26"/><rect x="460" y="370" width="20" height="26"/>
  </g>
  <!-- 路灯 -->
  <rect x="300" y="430" width="6" height="250" fill="#A1A1AA"/>
  <circle cx="303" cy="430" r="14" fill="#EFEFF1"/>
  <!-- 散步小人 -->
  <g fill="#18181B">
    <circle cx="270" cy="560" r="22"/>
    <rect x="252" y="584" width="36" height="70" rx="14"/>
    <rect x="256" y="650" width="14" height="60" rx="7"/>
    <rect x="276" y="650" width="14" height="60" rx="7"/>
  </g>
  <rect x="262" y="596" width="34" height="10" rx="5" fill="#D4D4D8"/>
</svg>
